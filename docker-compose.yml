version: '3.8'

services:
  # ─────────────────────────────────────
  # PostgreSQL - قاعدة البيانات على VPS
  # ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fouad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fouad
      POSTGRES_PASSWORD: fouad_db_password_2024
      POSTGRES_DB: fouad_f9
    volumes:
      - postgres_data:/var/lib/postgresql/data   # البيانات محفوظة بشكل دائم
    expose:
      - "5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fouad -d fouad_f9"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────
  # Backend (Node.js + Express + Prisma)
  # ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fouad_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=5000
      # يتصل بـ postgres container داخلياً - يتجاوز DATABASE_URL في .env.production
      - DATABASE_URL=postgresql://fouad:fouad_db_password_2024@postgres:5432/fouad_f9
    expose:
      - "5000"
    volumes:
      - ./backend/src/data:/app/src/data   # Persist coaches.json and settings.json
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy   # ينتظر PostgreSQL يكون جاهز أولاً
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────
  # Frontend (React + Vite - build only)
  # ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_IMGBB_API_KEY=${VITE_IMGBB_API_KEY}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: fouad_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy

  # ─────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fouad_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - app_network
    depends_on:
      - backend
      - frontend

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:    # بيانات PostgreSQL محفوظة حتى بعد إعادة تشغيل الـ container
  nginx_logs:
